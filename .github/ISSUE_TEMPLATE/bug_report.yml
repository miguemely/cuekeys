name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CueKeys version
      placeholder: "0.1.0 (Help → About)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux (X11), Linux (Wayland), Other]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Keypad and CircuitPython version
      description: Device profile (`cuekeys devices` shows it) and the first line of CIRCUITPY/boot_out.txt.
      placeholder: "keybow2040 - Adafruit CircuitPython 9.1.4 on 2024-09-17; Pimoroni Keybow 2040"
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [Editor, Overlay, Keypad / firmware, LEDs, MIDI / MSC, OSC, grandMA, Companion, Install / deploy, CLI]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `cuekeys -v gui` and/or the keypad console (CircuitPython REPL port), if relevant.
      render: text
