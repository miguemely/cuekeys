# Weekly dependency updates, grouped into one PR per ecosystem so a batch of
# bumps costs one CI run (Actions minutes are limited on private repos).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
