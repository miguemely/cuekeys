# On a vX.Y.Z tag: build the wheel/sdist, the firmware zip and desktop apps
# (macOS universal2, Windows x64 + ARM64, Linux x64 + ARM64 for Raspberry Pi 4/5),
# smoke-test every app, then publish a GitHub Release. Every app zip and the firmware
# zip come with a CycloneDX SBOM (*.cdx.json, scripts/sbom.py).
#
# Dry run: start this workflow by hand (Actions -> Release -> Run workflow). It
# builds and tests everything, including collecting the release assets, but
# never publishes. Publishing only ever happens for a pushed v* tag.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # True only for a pushed version tag; every manual run is a dry run.
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches __version__
        if: env.PUBLISH == 'true'
        run: |
          VERSION=$(PYTHONPATH=src python3 -c "import cuekeys as p; print(p.__version__)")
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $VERSION"; exit 1; }
      - name: Dry run
        if: env.PUBLISH != 'true'
        run: |
          echo "::notice::Dry run from ${GITHUB_REF_NAME} - everything is built and tested, nothing is published."

  python-dist:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: Firmware bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_firmware_bundle.py --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  app:
    needs: check-version
    name: app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel + Apple Silicon in one app: needs python.org's universal2 Python
          # (setup-python's macOS builds are single-architecture).
          - name: macos-universal2
            os: macos-latest
            build_args: --arch universal2
            python_pkg: "3.13.9"
            bin: dist/CueKeys.app/Contents/MacOS/CueKeys
          - name: windows-x86_64
            os: windows-latest
            py_arch: x64
            bin: dist/CueKeys/CueKeys.exe
          - name: windows-arm64
            os: windows-11-arm
            py_arch: arm64
            bin: dist/CueKeys/CueKeys.exe
          # Built on Ubuntu 22.04 (glibc 2.35) so it runs on Ubuntu 22.04+ / Debian 12+.
          - name: linux-x86_64
            os: ubuntu-22.04
            bin: dist/CueKeys/CueKeys
          # Raspberry Pi 4/5 (64-bit OS). PySide6 >= 6.8.1 aarch64 wheels need glibc
          # 2.39, which excludes Raspberry Pi OS bookworm (2.36); Qt 6.8 LTS (6.8.0.2)
          # needs only 2.31, so this build runs on Pi OS bookworm and trixie.
          - name: linux-arm64
            os: ubuntu-22.04-arm
            qt_pin: PySide6-Essentials==6.8.0.2
            bin: dist/CueKeys/CueKeys
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: matrix.python_pkg == ''
        with:
          python-version: "3.12"
          architecture: ${{ matrix.py_arch || '' }}
      - name: Universal2 Python (python.org)
        if: matrix.python_pkg != ''
        run: |
          V="${{ matrix.python_pkg }}"; MM="${V%.*}"
          curl -fsSLO "https://www.python.org/ftp/python/$V/python-$V-macos11.pkg"
          sudo installer -pkg "python-$V-macos11.pkg" -target /
          "/Library/Frameworks/Python.framework/Versions/$MM/bin/python3" -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 xvfb xauth binutils
      - name: Install
        shell: bash
        run: |
          python -m pip install -e ".[build]"
          if [ -n "${{ matrix.qt_pin }}" ]; then python -m pip install "${{ matrix.qt_pin }}"; fi
          python -c "import platform, PySide6; from PySide6.QtCore import qVersion; print(platform.machine(), 'PySide6', PySide6.__version__, 'Qt', qVersion())"
      - name: Check wheels are universal2
        if: matrix.python_pkg != ''
        run: |
          python - <<'PY'
          import glob, subprocess, PySide6, os
          so = glob.glob(os.path.join(os.path.dirname(PySide6.__file__), "QtCore*.so"))[0]
          archs = subprocess.check_output(["lipo", "-archs", so], text=True).split()
          print(so, archs); assert {"x86_64", "arm64"} <= set(archs), archs
          PY
      - run: python packaging/build_app.py ${{ matrix.build_args }}
      - name: Smoke test (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="${{ matrix.bin }}"
          "$BIN" --version
          "$BIN" profiles | grep -q keybow2040                                     # bundled profiles
          mkdir -p /tmp/fakepy && echo "Board ID:pimoroni_keybow2040" > /tmp/fakepy/boot_out.txt
          "$BIN" install-firmware --drive /tmp/fakepy | grep -q cuekeys_engine    # bundled firmware
          "$BIN" init /tmp/plain.json
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Real X11 (xcb) platform: proves the trimmed Qt still has everything xcb needs.
            QT_QPA_PLATFORM=xcb xvfb-run -a "$BIN" gui /tmp/plain.json & PID=$!
          else
            lipo -archs "$BIN" | tee /dev/stderr | grep -q "x86_64" && lipo -archs "$BIN" | grep -q "arm64"
            if arch -x86_64 /usr/bin/true 2>/dev/null; then arch -x86_64 "$BIN" --version; fi   # Intel slice via Rosetta
            QT_QPA_PLATFORM=offscreen "$BIN" gui /tmp/plain.json & PID=$!
          fi
          sleep 10; kill -0 $PID && kill $PID
      - name: SBOM
        shell: bash
        run: |
          python - <<'PY'
          import glob, json
          (path,) = glob.glob("dist/cuekeys-*.cdx.json")
          doc = json.load(open(path))
          names = {c["name"].lower().replace("_", "-") for c in doc["components"]}
          print(path, sorted(names))
          assert doc["bomFormat"] == "CycloneDX" and doc["metadata"]["component"]["name"] == "cuekeys"
          assert {"pyserial", "pyside6-essentials", "qt", "cpython", "pyinstaller bootloader"} <= names, names
          PY
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "${{ matrix.bin }}"
          # Windowed (GUI-subsystem) exe: check exit codes rather than console output.
          foreach ($a in @("--version", "profiles", "init $env:RUNNER_TEMP\plain.json")) {
            $p = Start-Process -FilePath $bin -ArgumentList $a -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "'$a' exited with $($p.ExitCode)" }
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $gui = Start-Process -FilePath $bin -ArgumentList "gui $env:RUNNER_TEMP\plain.json" -PassThru
          Start-Sleep -Seconds 10
          if ($gui.HasExited) { throw "GUI exited early with $($gui.ExitCode)" }
          Stop-Process -Id $gui.Id
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}
          path: |
            dist/cuekeys-*.zip
            dist/cuekeys-*.cdx.json

  release:
    needs: [python-dist, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Release assets
        run: |
          ls -la artifacts
          # wheel, sdist, firmware zip, and one app zip per OS
          test $(ls artifacts/*.whl | wc -l) -eq 1
          test $(ls artifacts/*.tar.gz | wc -l) -eq 1
          test $(ls artifacts/cuekeys-firmware-*.zip | wc -l) -eq 1
          ls artifacts/cuekeys-firmware-*.cdx.json
          for target in macos-universal2 windows-x86_64 windows-arm64 linux-x86_64 linux-arm64; do
            ls artifacts/cuekeys-*-$target.zip artifacts/cuekeys-*-$target.cdx.json
          done
      - name: Create GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "CueKeys ${GITHUB_REF_NAME}" \
            --notes "Desktop apps, Python wheel and the drag-and-drop firmware bundle for the CIRCUITPY drive, each with a CycloneDX SBOM (.cdx.json). See CHANGELOG.md. Free for non-commercial use (PolyForm Noncommercial 1.0.0); commercial use needs a license - see COMMERCIAL-LICENSE.md."

  # Optional: set the repository variable PUBLISH_PYPI=true and configure PyPI
  # "trusted publishing" for this repo and the `pypi` environment. Tags only.
  pypi:
    needs: python-dist
    if: vars.PUBLISH_PYPI == 'true' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - run: rm -f dist/cuekeys-firmware-*.zip dist/*.cdx.json
      - uses: pypa/gh-action-pypi-publish@release/v1
