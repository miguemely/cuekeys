# On a vX.Y.Z tag: build the wheel/sdist, the firmware zip and desktop apps for
# Linux, Windows and macOS, then publish a GitHub Release with all of them.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  check-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches __version__
        run: |
          VERSION=$(PYTHONPATH=src python3 -c "import cuekeys as p; print(p.__version__)")
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $VERSION"; exit 1; }

  python-dist:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: Firmware bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_firmware_bundle.py --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  app:
    needs: check-version
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libfontconfig1 libdbus-1-3 binutils
      - run: pip install -e ".[build]"
      - run: python packaging/build_app.py
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.os }}
          path: dist/cuekeys-*.zip

  release:
    needs: [python-dist, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "CueKeys ${GITHUB_REF_NAME}" \
            --notes "Desktop apps, Python wheel and the drag-and-drop firmware bundle for the CIRCUITPY drive. See CHANGELOG.md. Free for non-commercial use (PolyForm Noncommercial 1.0.0); commercial use needs a license - see COMMERCIAL-LICENSE.md."

  # Optional: set the repository variable PUBLISH_PYPI=true and configure PyPI
  # "trusted publishing" for this repo and the `pypi` environment.
  pypi:
    needs: python-dist
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - run: rm -f dist/cuekeys-firmware-*.zip
      - uses: pypa/gh-action-pypi-publish@release/v1
