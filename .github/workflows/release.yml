# On a vX.Y.Z tag: build the wheel/sdist, the firmware zip and desktop apps for
# Linux, Windows and macOS, smoke-test the apps, then publish a GitHub Release.
#
# Dry run: start this workflow by hand (Actions -> Release -> Run workflow). It
# builds and tests everything, including collecting the release assets, but
# never publishes. Publishing only ever happens for a pushed v* tag.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # True only for a pushed version tag; every manual run is a dry run.
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches __version__
        if: env.PUBLISH == 'true'
        run: |
          VERSION=$(PYTHONPATH=src python3 -c "import cuekeys as p; print(p.__version__)")
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $VERSION"; exit 1; }
      - name: Dry run
        if: env.PUBLISH != 'true'
        run: |
          echo "::notice::Dry run from ${GITHUB_REF_NAME} - everything is built and tested, nothing is published."

  python-dist:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: Firmware bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_firmware_bundle.py --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  app:
    needs: check-version
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: dist/CueKeys/CueKeys
          - os: windows-latest
            bin: dist/CueKeys/CueKeys.exe
          - os: macos-latest
            bin: dist/CueKeys.app/Contents/MacOS/CueKeys
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libfontconfig1 libdbus-1-3 binutils
      - run: pip install -e ".[build]"
      - run: python packaging/build_app.py
      - name: Smoke test the frozen app
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          BIN="${{ matrix.bin }}"
          test -x "$BIN" || test -f "$BIN"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Windowed (GUI-subsystem) exe: no console output to check, only that it's there.
            ls -la "$BIN"
          else
            "$BIN" --version
            "$BIN" profiles | grep -q keybow2040          # bundled device profiles
            mkdir -p /tmp/fakepy && echo "Board ID:pimoroni_keybow2040" > /tmp/fakepy/boot_out.txt
            "$BIN" install-firmware --drive /tmp/fakepy | grep -q "cuekeys_engine"   # bundled firmware
            "$BIN" init /tmp/plain.json
            "$BIN" gui /tmp/plain.json & PID=$!                # Qt loads in the frozen app
            sleep 8; kill -0 $PID && kill $PID
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.os }}
          path: dist/cuekeys-*.zip

  release:
    needs: [python-dist, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Release assets
        run: |
          ls -la artifacts
          # wheel, sdist, firmware zip, and one app zip per OS
          test $(ls artifacts/*.whl | wc -l) -eq 1
          test $(ls artifacts/*.tar.gz | wc -l) -eq 1
          test $(ls artifacts/cuekeys-firmware-*.zip | wc -l) -eq 1
          for os in linux windows macos; do ls artifacts/cuekeys-*-$os-*.zip; done
      - name: Create GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "CueKeys ${GITHUB_REF_NAME}" \
            --notes "Desktop apps, Python wheel and the drag-and-drop firmware bundle for the CIRCUITPY drive. See CHANGELOG.md. Free for non-commercial use (PolyForm Noncommercial 1.0.0); commercial use needs a license - see COMMERCIAL-LICENSE.md."

  # Optional: set the repository variable PUBLISH_PYPI=true and configure PyPI
  # "trusted publishing" for this repo and the `pypi` environment. Tags only.
  pypi:
    needs: python-dist
    if: vars.PUBLISH_PYPI == 'true' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - run: rm -f dist/cuekeys-firmware-*.zip
      - uses: pypa/gh-action-pypi-publish@release/v1
