# PMK Macro Manager - GitLab CI/CD
#
# Every push / MR:  lint -> test (Python 3.10-3.13) -> wheel + firmware bundle
# Tags (vX.Y.Z):    + desktop apps for Linux / Windows / macOS -> GitLab release
#
# Desktop builds on the default branch can be started manually.
# The macOS job needs GitLab-hosted macOS runners (Premium/Ultimate) or a
# self-hosted runner tagged "macos"; override MACOS_RUNNER_TAG if needed.

stages:
  - lint
  - test
  - build
  - package
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  QT_QPA_PLATFORM: offscreen
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pmk-macro-manager/${CI_COMMIT_TAG}"
  WINDOWS_RUNNER_TAG: saas-windows-medium-amd64
  MACOS_RUNNER_TAG: saas-macos-medium-m1

default:
  image: python:3.12-slim
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.pip-cache:
  cache:
    key: pip-$CI_JOB_NAME_SLUG
    paths: [.cache/pip]

.qt-deps: &qt-deps
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends
      libegl1 libgl1 libglib2.0-0 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null

.release-rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# ------------------------------------------------------------------ lint
ruff:
  stage: lint
  extends: .pip-cache
  script:
    - pip install -q "ruff>=0.5"
    - ruff check .

version-matches-tag:
  stage: lint
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION=$(PYTHONPATH=src python -c "import pmk_macro_manager as p; print(p.__version__)")
    - test "v$VERSION" = "$CI_COMMIT_TAG" || { echo "tag $CI_COMMIT_TAG != version $VERSION"; exit 1; }

# ------------------------------------------------------------------ test
pytest:
  stage: test
  extends: .pip-cache
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
  before_script:
    - *qt-deps
    - pip install -q -e ".[dev]"
  script:
    - pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

# ------------------------------------------------------------------ build
wheel:
  stage: build
  extends: .pip-cache
  script:
    - pip install -q build
    - python -m build
    - pip install dist/*.whl
    - python -c "from pmk_macro_manager import device; print(device.firmware_source())"
  artifacts:
    paths: [dist/*.whl, dist/*.tar.gz]
    expire_in: 30 days

firmware-bundle:
  stage: build
  script:
    - python scripts/build_firmware_bundle.py --out dist
  artifacts:
    paths: [dist/pmk-macro-manager-firmware-*.zip]
    expire_in: 30 days

# ------------------------------------------------------------------ package
app-linux:
  stage: package
  extends: [.pip-cache, .release-rules]
  needs: []
  before_script:
    - *qt-deps
    - apt-get install -y -qq --no-install-recommends binutils >/dev/null
    - pip install -q -e ".[build]"
  script:
    - python packaging/build_app.py
  artifacts:
    paths: [dist/pmk-macro-manager-*-linux-*.zip]
    expire_in: 30 days

app-windows:
  stage: package
  extends: .release-rules
  needs: []
  tags: [$WINDOWS_RUNNER_TAG]
  before_script:
    - choco install python312 -y --no-progress
    - $env:Path = "C:\Python312;C:\Python312\Scripts;$env:Path"
    - python -m pip install -q -e ".[build]"
  script:
    - python packaging/build_app.py
  artifacts:
    paths: [dist/pmk-macro-manager-*-windows-*.zip]
    expire_in: 30 days

app-macos:
  stage: package
  extends: .release-rules
  needs: []
  tags: [$MACOS_RUNNER_TAG]
  image: macos-14-xcode-15
  before_script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install -q -e ".[build]"
  script:
    - python packaging/build_app.py
  artifacts:
    paths: [dist/pmk-macro-manager-*-macos-*.zip]
    expire_in: 30 days

# ------------------------------------------------------------------ release
upload:
  stage: release
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs:
    - job: wheel
    - job: firmware-bundle
    - job: app-linux
    - job: app-windows
      optional: true
    - job: app-macos
      optional: true
  script:
    - |
      for file in dist/*; do
        name=$(basename "$file")
        echo "uploading $name"
        curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "$file" "${PACKAGE_REGISTRY_URL}/${name}"
        echo "{\"name\":\"${name}\",\"url\":\"${PACKAGE_REGISTRY_URL}/${name}\"}" >> assets.jsonl
      done
  artifacts:
    paths: [assets.jsonl]

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: [upload]
  script:
    - |
      LINKS=$(while IFS= read -r line; do printf -- "--assets-link '%s' " "$line"; done < assets.jsonl)
      eval "release-cli create --name 'PMK Macro Manager $CI_COMMIT_TAG' --tag-name '$CI_COMMIT_TAG' \
        --description 'Desktop apps, Python wheel and the drag-and-drop firmware bundle for the CIRCUITPY drive.' \
        $LINKS"

pypi:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/ && $PYPI_TOKEN
      when: manual
  needs: [wheel]
  script:
    - pip install -q twine
    - twine upload -u __token__ -p "$PYPI_TOKEN" dist/*.whl dist/*.tar.gz
