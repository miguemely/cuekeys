[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pmk-macro-manager"
dynamic = ["version"]
description = "Macros, layers, MIDI/OSC, grandMA and Companion for Pimoroni Keybow 2040 / Pico RGB Keypad"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pyserial>=3.5",
]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "ruff>=0.5", "PySide6>=6.6", "pytest-qt>=4.4"]
build = ["pyinstaller>=6.6", "PySide6>=6.6"]

[project.scripts]
pmm = "pmk_macro_manager.cli:main"

[project.gui-scripts]
pmm-gui = "pmk_macro_manager.gui.app:run_editor"

[tool.hatch.version]
path = "src/pmk_macro_manager/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pmk_macro_manager"]

[tool.hatch.build.targets.wheel.force-include]
"firmware" = "pmk_macro_manager/firmware"

[tool.hatch.build.targets.sdist]
include = ["src", "firmware", "tests", "scripts", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# CircuitPython code: keep it compatible with the MicroPython-flavoured subset.
"firmware/**" = ["B"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
