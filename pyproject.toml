[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cuekeys"
dynamic = ["version"]
description = "Macros, layers, MIDI/OSC, grandMA and Companion for Pimoroni Keybow 2040 / Pico RGB Keypad"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
dependencies = [
    "pyserial>=3.5",
]
classifiers = [
    "License :: Free for non-commercial use",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
dev = ["pytest>=8", "ruff>=0.5", "PySide6-Essentials>=6.6", "pytest-qt>=4.4"]
build = ["pyinstaller>=6.6", "PySide6-Essentials>=6.6"]

[project.scripts]
cuekeys = "cuekeys.cli:main"

[project.gui-scripts]
cuekeys-gui = "cuekeys.gui.app:run_editor"

[tool.hatch.version]
path = "src/cuekeys/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cuekeys"]

[tool.hatch.build.targets.wheel.force-include]
"firmware" = "cuekeys/firmware"

[tool.hatch.build.targets.sdist]
include = ["src", "firmware", "tests", "scripts", "licenses", "LICENSE", "THIRD_PARTY_NOTICES.md",
           "COMMERCIAL-LICENSE.md", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# CircuitPython code: keep it compatible with the MicroPython-flavoured subset.
"firmware/**" = ["B"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
